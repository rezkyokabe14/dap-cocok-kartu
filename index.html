<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocokkan Jenis Disabilitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: header → 5 type columns (each with a Definisi + Contoh slot) → shuffled card tray. Tap a card, then tap its column. Navy matches the DAP "Jenis Disabilitas" slide. */
:root{--navy:#0B3478;--navy-d:#082757;--teal:#5E9A96;--mint:#AEDCA6;--ok:#2E9E6B;--bad:#D2483F;--paper:#F5F7FB;--line:#D3DAE6;--ink:#14213D;--mute:#5B6478;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1280px;margin:0 auto;padding:14px 18px 30px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header img{height:40px;width:auto}
.ttl{text-align:center;flex:1}
.eb{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--teal);text-transform:uppercase}
h1{font-size:clamp(22px,3vw,34px);font-weight:800;line-height:1.1;text-wrap:balance}
.bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--mute)}
.pill{background:#fff;border:1px solid var(--line);border-radius:30px;padding:6px 14px;font-variant-numeric:tabular-nums}
.pill b{color:var(--navy)}
.hint{background:var(--navy);color:#fff;border-radius:14px;padding:10px 16px;font-size:15px;font-weight:600;text-align:center}

.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.col{background:#fff;border:2px solid var(--navy);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s;position:relative}
.col .cap{background:var(--navy);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;text-align:center;padding:6px 4px;line-height:1.15}
.col .head{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px 8px;text-align:center}
.col .ic{width:54px;height:54px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center}
.col .ic svg{width:38px;height:38px}
.col .nm{font-size:16px;font-weight:800;line-height:1.15}
.slot{margin:0 8px 8px;border:2px dashed var(--line);border-radius:12px;min-height:92px;display:flex;flex-direction:column;overflow:hidden;transition:border-color .2s,background .2s}
.slot .st{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:6px 8px 0;text-align:center}
.slot .sv{flex:1;display:grid;place-items:center;padding:6px 8px 8px;text-align:center;font-size:14px;line-height:1.3;font-weight:600;color:#9AA3B5}
.slot.none{visibility:hidden}
.slot.filled{border-style:solid;border-color:var(--ok);background:#EEF8F2}
.slot.filled .st{color:var(--ok)}
.slot.filled .sv{color:var(--ink)}
.slot.filled .sv{animation:land .55s cubic-bezier(.2,.9,.3,1.4)}
@keyframes land{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
body.picking .col:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(11,52,120,.18)}
body.picking .col{box-shadow:0 0 0 3px rgba(94,154,150,.25)}
.col.good{animation:good .7s ease}
@keyframes good{0%{box-shadow:0 0 0 0 rgba(46,158,107,.7)}100%{box-shadow:0 0 0 18px rgba(46,158,107,0)}}
.col.bad{animation:shake .45s ease;border-color:var(--bad)}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.col.done{border-color:var(--ok)}
.col.done .cap{background:var(--ok)}
.col .tick{position:absolute;top:30px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:800;transform:scale(0);transition:transform .4s cubic-bezier(.2,.9,.3,1.5)}
.col.done .tick{transform:scale(1)}

.tray h2{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:8px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px 12px;text-align:left;font:600 15px/1.35 var(--font);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s,box-shadow .15s,opacity .3s}
.card .tg{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--navy);border-radius:20px;padding:3px 10px}
.card.contoh .tg{background:var(--teal)}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,33,61,.12)}
.card.sel{border-color:#E7A94A;box-shadow:0 0 0 4px rgba(231,169,74,.35);transform:translateY(-3px) scale(1.02)}
.card.bad{animation:shake .45s ease;border-color:var(--bad)}
.card.gone{opacity:0;transform:scale(.8);pointer-events:none}
.card:focus-visible,.col:focus-visible{outline:3px solid #7AA4E1;outline-offset:3px}

.win{position:fixed;inset:0;background:rgba(11,39,87,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.win.on{display:flex}
.box{background:#fff;border-radius:26px;padding:30px 34px;text-align:center;max-width:440px;width:100%;animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.box .big{font-size:42px;font-weight:800;color:var(--ok)}
.box p{font-size:17px;color:var(--mute);margin:10px 0 18px;line-height:1.45}
.box button,.again{font:800 17px var(--font);background:var(--navy);color:#fff;border:none;border-radius:14px;padding:13px 22px;cursor:pointer}
.again{background:#fff;color:var(--navy);border:2px solid var(--navy);padding:8px 16px;font-size:14px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30}

@media (max-width:820px){
  .cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .col .head{flex-direction:row;justify-content:center}
  .col .ic{width:42px;height:42px}.col .ic svg{width:30px;height:30px}
  .slot{min-height:70px}
  .cards{grid-template-columns:1fr 1fr}
  header img{height:30px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const TYPES=[
 {id:'fisik',nm:'Disabilitas Fisik',def:'Gangguan pada fungsi gerak tubuh seseorang',ex:'Amputasi, lumpuh, cerebral palsy, dan penyakit kronis'},
 {id:'mental',nm:'Disabilitas Mental',def:'Gangguan fungsi emosi atau perilaku sosial',ex:'Depresi, bipolar, dan skizofrenia'},
 {id:'intel',nm:'Disabilitas Intelektual',def:'Keterbatasan dalam kemampuan berpikir dan belajar',ex:'Down syndrome, grahita, dan lambat belajar'},
 {id:'sensorik',nm:'Disabilitas Sensorik',def:'Gangguan pada salah satu panca indera',ex:'Tuli, tunanetra, dan tunawicara'},
 {id:'ganda',nm:'Disabilitas Ganda',def:'Kombinasi dua atau lebih jenis disabilitas yang berbeda',ex:null},
];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sel=null,ok=0,bad=0,t0=0,timerI=null;

function build(){
  sel=null;ok=0;bad=0;t0=0;clearInterval(timerI);$('sTime').textContent='0:00';
  $('cols').innerHTML=TYPES.map(t=>`<div class="col" role="button" tabindex="0" data-t="${t.id}" aria-label="${t.nm}">
    <div class="cap">JENIS<br>DISABILITAS</div><span class="tick" aria-hidden="true">✓</span>
    <div class="head"><div class="ic"><svg><use href="#i-${t.id}"/></svg></div><div class="nm">${t.nm.replace(' ','<br>')}</div></div>
    <div class="slot" data-s="def"><div class="st">Definisi</div><div class="sv">?</div></div>
    <div class="slot${t.ex?'':' none'}" data-s="ex"><div class="st">Contoh</div><div class="sv">?</div></div></div>`).join('');
  const cards=[];TYPES.forEach(t=>{cards.push({t:t.id,s:'def',txt:t.def});if(t.ex)cards.push({t:t.id,s:'ex',txt:t.ex})});
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}
  $('cards').innerHTML=cards.map((c,i)=>`<button type="button" class="card ${c.s==='ex'?'contoh':''}" data-t="${c.t}" data-s="${c.s}"><span class="tg">${c.s==='def'?'Definisi':'Contoh'}</span>${esc(c.txt)}</button>`).join('');
  stats();$('hint').textContent='1. Tap kartu di bawah  →  2. Tap jenis disabilitas yang cocok';
}
function stats(){$('sOk').textContent=ok;$('sBad').textContent=bad}
function tick(){const s=Math.floor((Date.now()-t0)/1000);$('sTime').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

$('cards').addEventListener('click',e=>{
  const c=e.target.closest('.card');if(!c||c.classList.contains('gone'))return;
  if(!t0){t0=Date.now();timerI=setInterval(tick,500)}
  if(sel)sel.classList.remove('sel');
  if(sel===c){sel=null;document.body.classList.remove('picking');return}
  sel=c;c.classList.add('sel');document.body.classList.add('picking');
  $('hint').textContent='Sekarang tap jenis disabilitas yang cocok dengan kartu ini';
  if(innerWidth<820)$('cols').scrollIntoView({behavior:'smooth',block:'start'});
});
function tryCol(col){
  if(!sel)return;
  const card=sel,ok_=card.dataset.t===col.dataset.t;
  if(ok_){
    const slot=col.querySelector(`.slot[data-s="${card.dataset.s}"]`);
    slot.querySelector('.sv').textContent=card.textContent.replace(/^(Definisi|Contoh)/,'');
    slot.classList.add('filled');card.classList.remove('sel');card.classList.add('gone');setTimeout(()=>card.remove(),300);
    col.classList.remove('good');void col.offsetWidth;col.classList.add('good');
    const need=col.querySelectorAll('.slot:not(.none)').length,have=col.querySelectorAll('.slot.filled').length;
    if(need===have)col.classList.add('done');
    const r=col.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/3,have===need?70:40);
    ok++;$('hint').textContent='Benar! Pilih kartu berikutnya';
    if(ok===9)finish();
  }else{
    bad++;[col,card].forEach(el=>{el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),600)});
    card.classList.remove('sel');$('hint').textContent='Belum tepat. Coba kartu itu di jenis lain';
  }
  sel=null;document.body.classList.remove('picking');stats();
}
$('cols').addEventListener('click',e=>{const col=e.target.closest('.col');if(col)tryCol(col)});
$('cols').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('col')){e.preventDefault();tryCol(e.target)}});
function finish(){
  clearInterval(timerI);const s=Math.floor((Date.now()-t0)/1000);
  $('winP').innerHTML=`Waktu <b>${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}</b> · ${bad?`<b>${bad}</b> kali salah`:'<b>tanpa salah!</b>'}<br>Sekarang diskusikan: bagaimana sikap kita saat berinteraksi dengan rekan dari tiap jenis disabilitas?`;
  setTimeout(()=>{$('win').classList.add('on');burst(innerWidth/2,innerHeight/3,220)},500);
}
$('again').onclick=()=>{$('win').classList.remove('on');build()};$('againTop').onclick=build;

const cv=$('fx'),ctx=cv.getContext('2d');let parts=[],raf=0;
function burst(x,y,n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#0B3478','#5E9A96','#AEDCA6','#E7A94A','#7AA4E1','#2E9E6B'];
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=3+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,r:Math.random()*6,vr:(Math.random()-.5)*.4,w:6+Math.random()*7,h:4+Math.random()*5,c:cols[i%cols.length],l:0})}
  if(!raf)raf=requestAnimationFrame(step);
}
function step(){ctx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l<110);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.98;p.r+=p.vr;p.l++;ctx.globalAlpha=Math.max(0,1-p.l/110);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
  ctx.globalAlpha=1;raf=parts.length?requestAnimationFrame(step):0}
build();
</script>
